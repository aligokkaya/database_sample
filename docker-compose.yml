version: "3.9"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  demo_postgres_data:
  ollama_data:


services:
  db:
    image: postgres:15-alpine
    container_name: discovery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-discovery_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-discovery_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  demo_db:
    image: postgres:15-alpine
    container_name: demo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_discovery_demo
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      - ./demo_db.sql:/docker-entrypoint-initdb.d/demo_db.sql:ro
    ports:
      - "5433:5432"
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d llm_discovery_demo" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: discovery_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discovery_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ./app:/app/app:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Java Spring Boot API ─────────────────────────────────────────────────────
  java_app:
    build:
      context: ./java
      dockerfile: Dockerfile
    container_name: discovery_java
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-discovery_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME:-admin}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-admin123}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen2.5:3b}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

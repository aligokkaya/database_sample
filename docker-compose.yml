version: "3.9"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  demo_postgres_data:
  ollama_data:


services:

  # ── System Database ─────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: discovery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-discovery_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-discovery_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Demo / Target Database ───────────────────────────────────────────────────
  demo_db:
    image: postgres:15-alpine
    container_name: demo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_discovery_demo
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      - ./demo_db.sql:/docker-entrypoint-initdb.d/demo_db.sql:ro
    ports:
      - "5433:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_discovery_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Ollama LLM Server ────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: discovery_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── FastAPI Application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discovery_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ./app:/app/app:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
